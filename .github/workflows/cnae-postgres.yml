name: CNAE PostgreSQL integration
on:
  push:
    branches: [feat/cnae-brasilapi-receita]
  pull_request:
    paths:
      - 'scripts/test-cnae-postgres.mjs'
      - '.github/workflows/cnae-postgres.yml'
      - 'app/api/**'
      - 'db/**'
      - 'lib/**'
      - 'supabase/migrations/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cnae-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: cnae_ci
          POSTGRES_PASSWORD: test_only_ephemeral_password
          POSTGRES_DB: cnae_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cnae_ci -d cnae_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      CNAE_TEST_DATABASE_URL: postgresql://cnae_ci:test_only_ephemeral_password@127.0.0.1:5432/cnae_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Integration tests with ephemeral PostgreSQL
        run: node scripts/test-cnae-postgres.mjs
